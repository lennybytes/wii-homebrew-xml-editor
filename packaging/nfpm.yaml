name: wii-meta-editor
arch: amd64
platform: linux
version: 0.1.0
section: utils
priority: optional
maintainer: Lenny <lennybytes@users.noreply.github.com>
description: |
  A simple dark-mode editor for Wii Homebrew Channel meta.xml files.

  Edit name, coder, version, release date, descriptions and arguments with a
  live XML preview and validation. Supports creating new files, opening
  existing meta.xml files, drag & drop and native file dialogs.
vendor: Lenny
homepage: https://github.com/lennybytes/wii-homebrew-xml-editor
license: MIT
contents:
  - src: target/release/wii-meta-editor
    dst: /usr/bin/wii-meta-editor
    file_info:
      mode: 0755
  - src: packaging/wii-meta-editor.desktop
    dst: /usr/share/applications/wii-meta-editor.desktop
    file_info:
      mode: 0644
  - src: packaging/wii-meta-editor.svg
    dst: /usr/share/icons/hicolor/scalable/apps/wii-meta-editor.svg
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/wii-meta-editor/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/wii-meta-editor/LICENSE
    file_info:
      mode: 0644
