[package]
name = "wii-meta-editor"
version = "0.1.0"
edition = "2024"
description = "A simple dark-mode editor for Wii Homebrew Channel meta.xml files"
authors = ["Lenny"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/lennybytes/wii-homebrew-xml-editor"
keywords = ["wii", "homebrew", "xml", "editor", "egui"]
categories = ["gui", "development-tools"]

[dependencies]
eframe = "0.37"
quick-xml = "0.42"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.18", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.18", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
